# Render Blueprint: one Docker web service + one Postgres database.
databases:
  - name: rookery-db
    plan: free

services:
  - type: web
    name: rookery
    runtime: docker
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rookery-db
          property: connectionString
